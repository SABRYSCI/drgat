<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة ولي الأمر - الاستعلام عن نتائج ودرجات الطالب</title>
  <!-- خط تجوال الحديث -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --secondary: #0f172a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .header-card {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      text-align: center;
      padding: 2.2rem 1.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.25);
      margin-bottom: 1.5rem;
    }

    .header-card h1 {
      font-size: 1.7rem;
      margin-bottom: 0.5rem;
      font-weight: 800;
    }

    .header-card p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .search-box {
      background: var(--card-bg);
      padding: 1.8rem;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    label {
      font-weight: 700;
      color: var(--secondary);
      font-size: 0.95rem;
    }

    .input-wrapper {
      display: flex;
      gap: 0.6rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.85rem 1.1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1.05rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    button {
      background-color: var(--primary-light);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1.6rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      background-color: var(--primary);
      transform: translateY(-1px);
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
      overflow: hidden;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      background: #eff6ff;
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-header h2 {
      font-size: 1.2rem;
      color: var(--primary);
      font-weight: 700;
    }

    .result-body {
      padding: 1.5rem;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table tr {
      border-bottom: 1px solid #f1f5f9;
    }

    .data-table tr:last-child {
      border-bottom: none;
    }

    .data-table td {
      padding: 0.9rem 0.5rem;
      font-size: 1rem;
    }

    .data-table td.label-cell {
      font-weight: 700;
      color: #64748b;
      width: 45%;
    }

    .data-table td.value-cell {
      font-weight: 600;
      color: var(--secondary);
      text-align: left;
    }

    .alert {
      padding: 1rem;
      border-radius: 12px;
      margin-top: 1rem;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .alert.error {
      background-color: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s ease-in-out infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <h1>استعلام نتائج وبيانات الطالب</h1>
      <p>بوابة ولي الأمر لمتابعة الدرجات والتقييمات المدرسية</p>
    </div>

    <div class="search-box">
      <div class="form-group">
        <label for="studentId">الرقم الشخصي للطالب:</label>
        <div class="input-wrapper">
          <input type="text" id="studentId" placeholder="أدخل الرقم الشخصي هنا..." autocomplete="off">
          <button id="searchBtn" onclick="fetchStudentData()">
            <span id="btnText">بحث</span>
            <span id="spinner" class="spinner" style="display: none;"></span>
          </button>
        </div>
      </div>
      <div id="alertBox" class="alert error"></div>
    </div>

    <div id="resultCard" class="result-card">
      <div class="result-header">
        <h2>بيانات ودرجات الطالب</h2>
      </div>
      <div class="result-body">
        <table class="data-table" id="dataTable">
          <!-- تملأ البيانات تلقائياً هنا -->
        </table>
      </div>
    </div>
  </div>

  <script>
    // رابط الـ Web App المربوط بملف البيانات الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzm27v5VEywcjaUmnJGRr_eI95DC2VGKKGHOLquw0dkWdeh6eIKjd49TExROO7JhtzGfg/exec";

    async function fetchStudentData() {
      const studentIdInput = document.getElementById("studentId");
      const id = studentIdInput.value.trim();
      const alertBox = document.getElementById("alertBox");
      const resultCard = document.getElementById("resultCard");
      const dataTable = document.getElementById("dataTable");
      const searchBtn = document.getElementById("searchBtn");
      const btnText = document.getElementById("btnText");
      const spinner = document.getElementById("spinner");

      alertBox.style.display = "none";
      resultCard.style.display = "none";
      dataTable.innerHTML = "";

      if (!id) {
        showAlert("يرجى إدخال الرقم الشخصي أولاً");
        return;
      }

      searchBtn.disabled = true;
      btnText.textContent = "جاري البحث...";
      spinner.style.display = "inline-block";

      try {
        const response = await fetch(`${SCRIPT_URL}?id=${encodeURIComponent(id)}`);
        const json = await response.json();

        if (json.status === "success") {
          renderData(json.data);
          resultCard.style.display = "block";
        } else {
          showAlert(json.message || "لم يتم العثور على أي نتائج لهذا الرقم");
        }
      } catch (error) {
        console.error(error);
        showAlert("تعذر الاتصال بقاعدة البيانات، يرجى التأكد من اتصال الإنترنت وإعدادات النشر");
      } finally {
        searchBtn.disabled = false;
        btnText.textContent = "بحث";
        spinner.style.display = "none";
      }
    }

    function renderData(data) {
      const table = document.getElementById("dataTable");
      table.innerHTML = "";

      for (const [key, value] of Object.entries(data)) {
        const tr = document.createElement("tr");

        const tdLabel = document.createElement("td");
        tdLabel.className = "label-cell";
        tdLabel.textContent = key;

        const tdValue = document.createElement("td");
        tdValue.className = "value-cell";
        tdValue.textContent = value !== "" ? value : "-";

        tr.appendChild(tdLabel);
        tr.appendChild(tdValue);
        table.appendChild(tr);
      }
    }

    function showAlert(msg) {
      const alertBox = document.getElementById("alertBox");
      alertBox.textContent = msg;
      alertBox.style.display = "block";
    }

    document.getElementById("studentId").addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        fetchStudentData();
      }
    });
  </script>
</body>
</html>
